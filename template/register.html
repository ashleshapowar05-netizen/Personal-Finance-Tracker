<!DOCTYPE html>

<html>

<head>

    <title>Register | FinTrack</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="auth-page">

<div class="auth-card">

    <div class="brand large">
        Fin<span>Track</span>
    </div>

    <p class="muted">
        Create your finance account
    </p>

    <h1>Get Started 🚀</h1>


    {% with messages =
    get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="alert {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST" class="form">

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Create password"
            minlength="6"
            required
        >


        <button
            class="btn primary full"
            type="submit"
        >
            Create Account
        </button>

    </form>


    <p class="auth-footer">

        Already registered?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

</body>

</html>
